# 코드 변경마다 솔버 시험을 실행해 논문이 인용하는 재현성을 외부에서 확인 가능하게 한다
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          cd solver
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"

      - name: Report environment
        run: |
          cd solver
          python -c "import numpy, scipy, sys; \
            print('python', sys.version.split()[0]); \
            print('numpy ', numpy.__version__); \
            print('scipy ', scipy.__version__)"

      # 비교 검증 모델은 재배포 권리가 없어 저장소에 없다. 관련 시험 26건은
      # 자동으로 건너뛰므로, 공개 환경의 기대값은 840 통과 26 건너뜀이다.
      - name: Run test suite
        run: |
          cd solver
          python -m pytest tests/ -q --junitxml=../test-results.xml

      - name: Check the public-clone expectation
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("test-results.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(s.get("tests")); skipped = int(s.get("skipped"))
          failures = int(s.get("failures")) + int(s.get("errors"))
          passed = total - skipped - failures
          print(f"passed={passed} skipped={skipped} failures={failures}")
          assert failures == 0, "test failures"
          # 비교 모델 자료가 없는 공개 환경에서만 성립하는 기대값
          assert skipped == 26, (
              f"expected 26 skips (comparison-model tests), got {skipped}; "
              "update README and the papers if the suite changed")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

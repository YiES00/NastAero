# 코드 변경마다 솔버 시험을 실행해 논문이 인용하는 재현성을 외부에서 확인 가능하게 한다
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # 설치 프로파일마다 기대값이 다르므로 둘 다 검증한다. GUI 추가 의존성
    # 없이 설치하면 tests/test_gui.py 51건이 수집되지 않는다(모듈 단위
    # importorskip이 건너뜀 1건으로 계상).
    name: pytest ${{ matrix.python-version }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        profile: [solver, full]
        include:
          - profile: solver
            extras: "dev,plot"
            expect_total: 981
            expect_passed: 955
            expect_skipped: 26
          - profile: full
            extras: "dev,plot,gui"
            expect_total: 1031
            expect_passed: 1005
            expect_skipped: 26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt 바인딩은 위젯을 만들지 않아도 import 시점에 이 라이브러리들을 찾는다
      - name: Install Qt runtime libraries
        if: matrix.profile == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install
        run: |
          cd solver
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Report environment
        run: |
          cd solver
          python -c "import numpy, scipy, sys; \
            print('python', sys.version.split()[0]); \
            print('numpy ', numpy.__version__); \
            print('scipy ', scipy.__version__)"

      # 비교 검증 모델은 재배포 권리가 없어 저장소에 없다. 관련 시험 26건은
      # 자동으로 건너뛴다.
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd solver
          python -m pytest tests/ -q --junitxml=../test-results.xml

      - name: Check the documented expectation
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          r = ET.parse("test-results.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(s.get("tests"))
          skipped = int(s.get("skipped"))
          failures = int(s.get("failures")) + int(s.get("errors"))
          passed = total - skipped - failures
          print(f"total={total} passed={passed} skipped={skipped} failures={failures}")
          assert failures == 0, "test failures"
          # README와 논문의 가용성 문장이 인용하는 값. 어긋나면 문서를 함께
          # 고쳐야 하므로 조용히 지나가지 않게 총계까지 단언한다.
          exp = {k: int(os.environ[k]) for k in ("EXPECT_TOTAL", "EXPECT_PASSED", "EXPECT_SKIPPED")}
          got = (total, passed, skipped)
          want = (exp["EXPECT_TOTAL"], exp["EXPECT_PASSED"], exp["EXPECT_SKIPPED"])
          assert got == want, (
              f"expected (total, passed, skipped)={want}, got {got}; "
              "the suite changed -- update README.md and the papers' "
              "data-availability statements together with this workflow")
          PY
        env:
          EXPECT_TOTAL: ${{ matrix.expect_total }}
          EXPECT_PASSED: ${{ matrix.expect_passed }}
          EXPECT_SKIPPED: ${{ matrix.expect_skipped }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.profile }}
          path: test-results.xml

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nastaero"
version = "1.1.0"
description = "Open-source structural analysis FEA solver with Nastran BDF I/O and aeroelasticity"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE", "../NOTICE"]
authors = [{ name = "Eunsuk Lee" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    # 인증 설정(.yaml)을 읽는 경로에 필요 — ILC-8/ILC-8T 재현 덱이 YAML이다
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
plot = ["matplotlib>=3.5"]
gui = [
    "qtpy>=2.3",
    "pyside6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "matplotlib>=3.5",
]

[project.scripts]
nastaero = "nastaero.__main__:main"
nastaero-gui = "nastaero.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nastaero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
